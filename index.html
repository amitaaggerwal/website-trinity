<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trinity — Coming Soon</title>
<meta name="description" content="Trinity. Simply, Better. Coming soon.">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,600;125,700&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0A0A0A}
body{color:#F2F2F2;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
::selection{background:#F2F2F2;color:#0A0A0A}

.silver{background:linear-gradient(180deg,#FFFFFF 0%,#E6E6E6 60%,#9E9E9E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Fold 1 */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse 70% 80% at 85% 20%,#2A2A2A 0%,#141414 40%,#0A0A0A 75%)}
.hero .light{position:absolute;inset:0;background:radial-gradient(ellipse 40% 45% at 78% 30%,rgba(255,255,255,.10) 0%,rgba(255,255,255,.03) 45%,rgba(255,255,255,0) 75%)}
.hero .beam{position:absolute;top:-30%;right:4%;width:34%;height:170%;filter:blur(20px);
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.05) 40%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.05) 60%,rgba(255,255,255,0) 100%);
  animation:drift 22s ease-in-out infinite alternate}
.hero .fade{position:absolute;left:0;right:0;bottom:0;height:240px;background:linear-gradient(180deg,rgba(10,10,10,0) 0%,#0A0A0A 100%)}
.grain{position:absolute;inset:0;width:100%;height:100%;opacity:.08;pointer-events:none;mix-blend-mode:overlay}
.hero .wrap{position:relative;z-index:2;flex-grow:1;display:flex;align-items:center;padding:clamp(64px,7vw,104px) clamp(20px,4vw,56px)}
h1{margin:0;width:100%;font-family:Archivo,sans-serif;font-stretch:125%;font-weight:700;font-size:clamp(56px,12.4vw,200px);line-height:.88;letter-spacing:-.035em;text-transform:uppercase}
h1 .line{display:block;width:fit-content}
h1 .indent{margin-left:clamp(28px,9vw,168px)}
h1 .row{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.28em}
h1 .italic{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:1.16em;line-height:.8;letter-spacing:-.01em;text-transform:none;color:#FFFFFF}
.r1{animation:rise 1.6s cubic-bezier(.16,.8,.12,1) both}
.r2{animation:rise 1.6s .15s cubic-bezier(.16,.8,.12,1) both}
.r3{animation:rise 1.6s .30s cubic-bezier(.16,.8,.12,1) both}
.r4{animation:rise 1.6s .45s cubic-bezier(.16,.8,.12,1) both}

/* Fold 2 */
.soon{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;padding:120px 20px;
  border-top:1px solid #1E1E1E;background:radial-gradient(ellipse 50% 50% at 50% 50%,#161616 0%,#0A0A0A 70%);text-align:center}
.soon .rule{display:block;width:1px;height:72px;background:linear-gradient(180deg,rgba(242,242,242,0),#F2F2F2)}
.soon .brand{display:flex;flex-direction:column;align-items:center;gap:12px}
.soon .name{margin:0;font-family:Archivo,sans-serif;font-stretch:125%;font-weight:600;font-size:clamp(36px,4.6vw,68px);line-height:1;letter-spacing:-.01em;color:#F2F2F2}
.soon .tag{margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(24px,2.4vw,36px);line-height:1.1;color:#B3B3B3}
h2{margin:0;font-family:Archivo,sans-serif;font-stretch:125%;font-weight:600;font-size:clamp(44px,8vw,128px);line-height:.95;letter-spacing:-.02em;text-transform:uppercase}

footer{padding:36px 20px 44px;text-align:center;border-top:1px solid #1E1E1E}
footer p{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#8C8C8C}

@keyframes drift{0%{transform:translateX(-4%) rotate(-24deg);opacity:.7}50%{opacity:1}100%{transform:translateX(4%) rotate(-24deg);opacity:.7}}
@keyframes rise{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.hero .beam,.r1,.r2,.r3,.r4{animation:none}}
</style>
</head>
<body>

<main>
<section class="hero">
<div class="light" aria-hidden="true"></div>
<div class="beam" aria-hidden="true"></div>
<div class="fade" aria-hidden="true"></div>
<svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>
<div class="wrap">
<h1 aria-label="Your brand will outlive you.">
<span class="line silver r1" aria-hidden="true">Your</span>
<span class="line indent silver r2" aria-hidden="true">Brand</span>
<span class="row r3" aria-hidden="true"><span class="silver">Will</span><span class="italic">outlive</span></span>
<span class="line indent silver r4" aria-hidden="true">You.</span>
</h1>
</div>
</section>

<section class="soon">
<span class="rule" aria-hidden="true"></span>
<div class="brand">
<p class="name">Trinity</p>
<p class="tag">Simply, Better.</p>
</div>
<h2 class="silver">Coming Soon.</h2>
</section>
</main>

<footer>
<p>This website is managed by Trinity.</p>
</footer>

</body>
</html>
